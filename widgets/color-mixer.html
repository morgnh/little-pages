<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>color mixer</title>
<style>
  :root{
    --ink: #1b1b1b;
    --line: #1b1b1b;
    --panel: #fdf8ec;
    --dim: #554e42;
    --mono: "Courier New", "Courier", monospace;
  }
  html,body{background:#efe7d3;margin:0;padding:0}
  body{font-family:var(--mono);color:var(--ink);font-size:14px;line-height:1.45;
       padding:0}
  .wrap{display:flex;flex-direction:column;gap:14px;max-width:960px;padding:14px 16px 20px}

  .rainbow{height:10px;border:3px solid var(--line);
    background:linear-gradient(to right,
      #e22 0 16.6%, #f80 16.6% 33.3%, #fd0 33.3% 50%,
      #3b3 50% 66.6%, #39c 66.6% 83.3%, #a4f 83.3% 100%)}

  h1{font-size:25px;margin:0;text-transform:lowercase;letter-spacing:-1px;color:#111;
     display:inline-block;background:#e8508a;padding:2px 9px 3px;
     border:3px solid var(--line);box-shadow:6px 6px 0 var(--line);align-self:flex-start}
  h1 .hrt{color:#111;text-shadow:none;font-size:19px}
  .sub{margin:0;color:var(--dim);font-size:13px;max-width:52ch}

  .panel{background:var(--panel);border:3px solid var(--line);
         box-shadow:6px 6px 0 var(--line)}

  .pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .pot{padding:10px 11px 12px}
  .pot h2{font-size:12px;margin:0 0 8px;text-transform:lowercase;letter-spacing:2px;
          color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:6px}
  .pot h2 b{color:var(--ink);letter-spacing:0;font-size:12px}
  .swatches{display:flex;flex-wrap:wrap;gap:7px}
  .sw{width:30px;height:30px;padding:0;border:3px solid var(--line);cursor:pointer;
      box-shadow:3px 3px 0 var(--line);transition:transform .05s linear}
  .sw:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
  .sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
  .custom{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;
          text-transform:lowercase;letter-spacing:1px;color:var(--dim)}
  input[type="color"]{width:38px;height:26px;padding:0;border:3px solid var(--line);
    background:var(--panel);cursor:pointer}

  .ratio{padding:10px 12px 12px}
  .ratio .row{display:flex;justify-content:space-between;align-items:baseline;
              font-size:11px;text-transform:lowercase;letter-spacing:2px;color:var(--dim)}
  .ratio .row output{color:var(--ink);letter-spacing:0;font-size:13px}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:14px;
    margin:9px 0 0;background:var(--panel);border:3px solid var(--line);cursor:pointer}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    margin-top:-6px;background:var(--ink);border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
  input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:0;
    background:var(--ink);border:3px solid var(--line)}

  .result{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
  .big{position:relative;min-height:118px;display:flex;align-items:flex-end;padding:10px}
  .big .hexbox{border:3px solid var(--line);background:var(--panel);color:var(--ink);
    padding:3px 7px;font-size:14px;letter-spacing:1px;cursor:pointer;
    box-shadow:3px 3px 0 var(--line)}
  .big .cap{position:absolute;top:8px;left:10px;font-size:10px;letter-spacing:2px;
    text-transform:lowercase;background:var(--panel);border:2px solid var(--line);padding:1px 5px}
  .big .note{position:absolute;right:9px;bottom:9px;margin:0;font-size:10px;letter-spacing:1px;
    text-transform:lowercase;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:1px 5px}

  .ladder{padding:10px 11px 11px}
  .ladder h3{margin:0 0 8px;font-size:11px;letter-spacing:2px;text-transform:lowercase;color:var(--dim)}
  .steps{display:flex;height:44px;border:3px solid var(--line)}
  .steps i{flex:1;display:block}
  .marks{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--dim)}

  .foot{margin:0;font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:lowercase}
  .flash{outline:3px solid var(--ink);outline-offset:2px}
  @media (max-width:520px){
    .result{grid-template-columns:1fr}
    h1{font-size:22px}
  }
  @media (max-width:430px){
    .pots{grid-template-columns:1fr}
    .sw{width:27px;height:27px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="rainbow"></div>
  <h1>color mixer <span class="hrt">&#9829;</span></h1>
  <p class="sub">pick two paints, drag the ratio, see what they make and what sits opposite.</p>

  <div class="pots">
    <section class="pot panel" data-pot="a">
      <h2>pot a <b id="hexA">#e8508a</b></h2>
      <div class="swatches"></div>
      <label class="custom">custom <input type="color" value="#e8508a"></label>
    </section>
    <section class="pot panel" data-pot="b">
      <h2>pot b <b id="hexB">#2ec4b6</b></h2>
      <div class="swatches"></div>
      <label class="custom">custom <input type="color" value="#2ec4b6"></label>
    </section>
  </div>

  <div class="ratio panel">
    <div class="row"><span>mix ratio</span><output id="ratioOut">50 / 50</output></div>
    <input type="range" id="ratio" min="5" max="95" step="1" value="50">
  </div>

  <div class="result">
    <div class="big panel" id="mixBig">
      <span class="cap">the mix</span>
      <div class="hexbox" id="mixHex">#000000</div>
    </div>
    <div>
      <div class="big panel" id="compBig">
        <span class="cap">opposite</span>
        <div class="hexbox" id="compHex">#000000</div>
        <span class="note">its complement</span>
      </div>
    </div>
  </div>

  <div class="ladder panel">
    <h3>the mixing ladder</h3>
    <div class="steps" id="steps"></div>
    <div class="marks"><span>all a</span><span>half</span><span>all b</span></div>
  </div>

  <p class="foot">click any hex to copy it.</p>
</div>

<script>
(function(){
  var PRESETS = ["#e8508a","#f7a072","#fd0","#3b3","#2ec4b6","#39c","#a4f","#6b4423","#111","#fff"];
  var state = {a:"#e8508a", b:"#2ec4b6", r:50};

  function h2r(h){h=h.replace("#",""); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function r2h(c){return "#"+c.map(function(v){var s=Math.round(v).toString(16);
    return s.length<2?"0"+s:s;}).join("");}
  function toLin(c){c/=255; return c<=0.04045? c/12.92 : Math.pow((c+0.055)/1.055,2.4);}
  function toSrgb(x){x=x<=0.0031308? 12.92*x : 1.055*Math.pow(x,1/2.4)-0.055;
    return Math.max(0,Math.min(255,x*255));}

  // mix in linear light so 50/50 yellow+blue lands somewhere believable
  function mix(c1,c2,t){
    var a=h2r(c1).map(toLin), b=h2r(c2).map(toLin);
    return r2h(a.map(function(v,i){return toSrgb(v*(1-t)+b[i]*t);}));
  }
  function rgb2hsl(c){
    var r=c[0]/255,g=c[1]/255,b=c[2]/255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, s=0, l=(mx+mn)/2;
    if(d){ s=d/(1-Math.abs(2*l-1));
      if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
      h*=60; if(h<0) h+=360; }
    return [h,s*100,l*100];
  }
  function hsl2rgb(h,s,l){
    s/=100; l/=100;
    var k=function(n){return (n+h/30)%12;};
    var a=s*Math.min(l,1-l);
    var f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));};
    return [f(0)*255,f(8)*255,f(4)*255];
  }
  function complement(hex){
    var hsl=rgb2hsl(h2r(hex));
    var out=hsl2rgb((hsl[0]+180)%360, Math.max(hsl[1],8), Math.min(Math.max(hsl[2],12),88));
    return r2h(out);
  }
  function luminance(hex){
    var c=h2r(hex).map(toLin);
    return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  }
  function inkFor(hex){ return luminance(hex)>0.35 ? "#111" : "#fff"; }

  function buildSwatches(){
    document.querySelectorAll(".pot").forEach(function(pot){
      var key=pot.dataset.pot, box=pot.querySelector(".swatches");
      box.innerHTML="";
      PRESETS.forEach(function(col){
        var b=document.createElement("button");
        b.className="sw"; b.type="button"; b.style.background=col;
        b.setAttribute("data-col",col);
        b.setAttribute("aria-pressed","false");
        b.setAttribute("aria-label","use "+col);
        b.addEventListener("click",function(){
          state[key]=col; pot.querySelector('input[type="color"]').value=col; render();
        });
        box.appendChild(b);
      });
    });
  }

  function render(){
    var mixed= mix(state.a,state.b,state.r/100);
    var comp= complement(mixed);

    document.getElementById("hexA").textContent=state.a;
    document.getElementById("hexB").textContent=state.b;
    document.getElementById("ratioOut").textContent=(100-state.r)+" / "+state.r;

    var big=document.getElementById("mixBig");
    big.style.background=mixed;
    document.getElementById("mixHex").textContent=mixed.toUpperCase();
        
    var cb=document.getElementById("compBig");
    cb.style.background=comp;
    document.getElementById("compHex").textContent=comp.toUpperCase();
        
    var steps=document.getElementById("steps");
    steps.innerHTML="";
    for(var i=0;i<=10;i++){
      var s=document.createElement("i");
      s.style.background=mix(state.a,state.b,i/10);
      s.title=(i*10)+"%";
      steps.appendChild(s);
    }

    document.querySelectorAll(".pot").forEach(function(pot){
      var key=pot.dataset.pot;
      pot.querySelectorAll(".sw").forEach(function(b){
        b.setAttribute("aria-pressed", b.dataset.col===state[key] ? "true":"false");
      });
      pot.querySelector('input[type="color"]').value=state[key];
    });
  }

  document.querySelectorAll(".pot").forEach(function(pot){
    pot.querySelector('input[type="color"]').addEventListener("input",function(e){
      state[pot.dataset.pot]=e.target.value; render();
    });
  });
  document.getElementById("ratio").addEventListener("input",function(e){
    state.r=+e.target.value; render();
  });

  function copyTarget(el){
    function flash(){el.classList.add("flash");setTimeout(function(){el.classList.remove("flash");},350);}
    var text=el.textContent.trim();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(flash,function(){
        var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);
        t.select();try{document.execCommand("copy");}catch(e){}t.remove();flash();});
    } else {
      var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);
      t.select();try{document.execCommand("copy");}catch(e){}t.remove();flash();
    }
  }
  document.getElementById("mixHex").addEventListener("click",function(){copyTarget(this);});
  document.getElementById("compHex").addEventListener("click",function(){copyTarget(this);});

  buildSwatches(); render();
  window.__mixer={mix:mix,complement:complement,get:function(){return {a:state.a,b:state.b,r:state.r};}};
})();
</script>
</body>
</html>
